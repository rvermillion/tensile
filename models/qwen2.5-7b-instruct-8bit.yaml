name: qwen2.5-7b-instruct-8bit
kind: default
repo: hf:mlx-community/qwen2.5-7b-instruct-8bit
dtype: float16
quantization:
  group_size: 64
  bit: 8
model:
  vocab_size: 152064
  hidden_size: 3584
  layers:
    count: 28
    _:
      kind: transformer
      input_layernorm:
        kind: rms
        eps: 1e-06
      attention:
        kind: standard
        num_attention_heads: 28
        num_key_value_heads: 4
        bias: true
        o_proj:
          bias: false
        position_encoder:
          kind: rope
          traditional: false
          max_positions: 32768
          base: 1000000.0
      mlp:
        kind: glu
        activation: silu
        bias: false
        hidden_dim: 18944
      post_attention_layernorm:
        kind: rms
        eps: 1e-06
  norm:
    kind: rms
    eps: 1e-06
lm_head:
  kind: linear
  bias: false
cache:
  kind: default
  max_window_layers: 28
  use_sliding_window: false
