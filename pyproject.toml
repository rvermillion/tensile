[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tensile-ml"
version = "0.1.0"
authors = [
  { name="Richard Vermillion", email="richard@vermillion.nyc" },
]
description = "A research-oriented ML framework"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.scripts]
tensile = "tensile.cli:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
"tensile.models._configs" = ["**/*.yaml"]

[project.urls]
"Homepage" = "https://github.com/rvermillion/tensile"
